[project]
name = "chatbot"
version = "0.1.0"
description = "Enterprise GenAI Chatbot"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

markers = [
    "unit: fast, isolated tests",
    "integration: slower tests that may touch external systems",
]