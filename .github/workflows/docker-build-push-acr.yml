name: Build and Push Image to ACR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ACRGlobalService01

      - name: Build Docker image
        run: |
          docker build -t acrglobalservice01.azurecr.io/chatbot:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push acrglobalservice01.azurecr.io/chatbot:${{ github.sha }}
