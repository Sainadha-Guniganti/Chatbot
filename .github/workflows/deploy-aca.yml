name: CD - Deploy to ACA Dev

on:
  workflow_run:
    workflows: ["Build and Push Image to ACR"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to ACA (DEV)
    runs-on: ubuntu-latest

    # Optional: if your CI might fail and you only want CD on success
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure Context
        run: az account show
      
      - name: Set ACA Secrets
        run: |
          az containerapp secret set \
            --name ${{ vars.ACA_APP_NAME_DEV }} \
            --resource-group ${{ vars.ACA_RESOURCE_GROUP }} \
            --secrets \
              azure-openai-api-key=${{ secrets.AZURE_OPENAI_API_KEY }} \
              azure-search-key=${{ secrets.AZURE_SEARCH_KEY }}
      - name: Inject image into YAML
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ vars.ACR_SERVER }}/chatbot:${{ github.event.workflow_run.head_sha }}|g" src/build-deploy/env-vars.yaml


      - name: Deploy image to Azure Container App (DEV)
        run: |
          az containerapp update \
            --name ${{ vars.ACA_APP_NAME_DEV }} \
            --resource-group ${{ vars.ACA_RESOURCE_GROUP }} \
            --yaml src/build-deploy/env-vars.yaml

